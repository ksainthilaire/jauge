openapi: 3.1.0
info:
  title: Jauge API
  version: 1.0.0
  description: |
    API of the Jauge mobile app. Paths are in English, bodies are JSON (except image uploads, multipart).
    All dates are ISO 8601. Salaries are annual gross amounts in thousands of euros.
    Every error answer uses the `Error` body; the app maps `error.code` (or the HTTP status) to a friendly message.
    See docs/api.md for the behaviour of each endpoint.
servers:
  - url: https://api.jauge.io
security:
  - bearerAuth: []
tags:
  - name: Analyses
  - name: Insights
  - name: Alerts
  - name: Shares
  - name: Account
  - name: Operations
paths:
  /v1/analyses:
    post:
      tags: [Analyses]
      summary: Start the analysis of an offer (link, manual entry, text read on the phone, or image)
      operationId: createAnalysis
      description: |
        Starts the collection and the computation in the work queue and answers at once. An offer analyzed by anyone in
        the last 7 days (same normalized offer) is answered from the cache, often already `completed` in this answer.
        The same `Idempotency-Key`, or the same link or manual entry within 10 minutes, gives back the first analysis
        without using the free analysis again.
      parameters:
        - name: Idempotency-Key
          in: header
          required: false
          description: Random value chosen by the app for this tap (8 to 64 letters, digits, `-`, `_`), kept 24 hours.
          schema: { type: string, pattern: '^[A-Za-z0-9_-]{8,64}$' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAnalysisRequest'
          multipart/form-data:
            schema:
              type: object
              required: [image, origin]
              properties:
                image:
                  type: string
                  format: binary
                  description: JPEG, PNG or HEIC, 10 MB at most.
                origin:
                  type: string
                  enum: [screenshot, photo]
                areaCity: { type: string, description: City of the search area of the user (never a position). }
                areaDepartment: { type: string, description: 'French department of that city (`69`, `2A`, `974`).' }
                areaRadius: { type: integer, description: Radius of the search area in kilometers. }
      responses:
        '202':
          description: Analysis accepted, status `processing`. Poll GET /v1/analyses/{id}.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Analysis'
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '402': { $ref: '#/components/responses/Error' }
        '413': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
    get:
      tags: [Analyses]
      summary: Analyses of the user, newest first
      operationId: listAnalyses
      parameters:
        - name: cursor
          in: query
          schema: { type: string }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
        - $ref: '#/components/parameters/SearchQuery'
      responses:
        '200':
          description: One page of analyses.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnalysisPage'
        '401': { $ref: '#/components/responses/Error' }
  /v1/analyses/{id}:
    parameters:
      - $ref: '#/components/parameters/AnalysisId'
    get:
      tags: [Analyses]
      summary: One analysis (polled while processing)
      operationId: getAnalysis
      responses:
        '200':
          description: The analysis.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Analysis'
        '404': { $ref: '#/components/responses/Error' }
    delete:
      tags: [Analyses]
      summary: Delete an analysis
      operationId: deleteAnalysis
      responses:
        '204': { description: Deleted. }
        '404': { $ref: '#/components/responses/Error' }
  /v1/analyses/{id}/favorite:
    parameters:
      - $ref: '#/components/parameters/AnalysisId'
    put:
      tags: [Analyses]
      summary: Mark the analysis as a favorite (star). Idempotent.
      operationId: addFavorite
      responses:
        '204': { description: The analysis is a favorite. }
        '404': { $ref: '#/components/responses/Error' }
    delete:
      tags: [Analyses]
      summary: Remove the analysis from the favorites. Idempotent.
      operationId: removeFavorite
      responses:
        '204': { description: The analysis is not a favorite. }
        '404': { $ref: '#/components/responses/Error' }
  /v1/analyses/{id}/salary:
    parameters:
      - $ref: '#/components/parameters/AnalysisId'
    get:
      tags: [Insights]
      summary: Salary of the position in the area
      operationId: getSalary
      parameters:
        - $ref: '#/components/parameters/AreaCity'
        - $ref: '#/components/parameters/AreaDepartment'
      responses:
        '200':
          description: Salary insight.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SalaryInsight'
        '404': { $ref: '#/components/responses/Error' }
  /v1/analyses/{id}/skills:
    parameters:
      - $ref: '#/components/parameters/AnalysisId'
    get:
      tags: [Insights]
      summary: Skills asked for by twin offers
      operationId: getSkills
      responses:
        '200':
          description: Skills insight.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SkillsInsight'
        '404': { $ref: '#/components/responses/Error' }
  /v1/analyses/{id}/trend:
    parameters:
      - $ref: '#/components/parameters/AnalysisId'
    get:
      tags: [Insights]
      summary: Applicants per offer over 12 months
      operationId: getTrend
      responses:
        '200':
          description: Trend insight.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TrendInsight'
        '404': { $ref: '#/components/responses/Error' }
  /v1/analyses/{id}/twins:
    parameters:
      - $ref: '#/components/parameters/AnalysisId'
    get:
      tags: [Insights]
      summary: Twin offers (same job, fewer applicants)
      operationId: getTwins
      parameters:
        - name: sort
          in: query
          schema:
            type: string
            enum: [least_disputed, best_paid, most_recent]
            default: least_disputed
        - $ref: '#/components/parameters/AreaCity'
        - $ref: '#/components/parameters/AreaDepartment'
        - name: radius
          in: query
          description: Radius of the search area in kilometers (10, 30, 50 or 100). Twins are looked for within it.
          schema: { type: integer, minimum: 1, maximum: 200 }
        - $ref: '#/components/parameters/SearchQuery'
      responses:
        '200':
          description: Twin offers.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TwinOffers'
        '404': { $ref: '#/components/responses/Error' }
  /v1/analyses/{id}/feedback:
    parameters:
      - $ref: '#/components/parameters/AnalysisId'
    post:
      tags: [Insights]
      summary: Send the real number of applicants known by the user
      operationId: sendApplicantFeedback
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [actualApplicants]
              properties:
                actualApplicants: { type: integer, minimum: 1, maximum: 100000 }
      responses:
        '204': { description: Thank you. }
        '404': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
  /v1/methodology:
    get:
      tags: [Insights]
      summary: How the estimate of an analysis was made
      operationId: getMethodology
      parameters:
        - name: analysisId
          in: query
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Methodology.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Methodology'
        '404': { $ref: '#/components/responses/Error' }
  /v1/alerts:
    get:
      tags: [Alerts]
      summary: Calm alerts of the user
      operationId: listAlerts
      responses:
        '200':
          description: Alerts.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/Alert' }
    post:
      tags: [Alerts]
      summary: Create a calm alert on the twins of an analysis
      operationId: createAlert
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [analysisId, threshold]
              properties:
                analysisId: { type: string }
                threshold: { type: integer, minimum: 1, maximum: 100, default: 30 }
      responses:
        '201':
          description: Alert created.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Alert' }
        '402': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /v1/alerts/{id}:
    delete:
      tags: [Alerts]
      summary: Delete a calm alert
      operationId: deleteAlert
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        '204': { description: Deleted. }
        '404': { $ref: '#/components/responses/Error' }
  /v1/shares:
    get:
      tags: [Shares]
      summary: Shares of the user, newest first
      operationId: listShares
      responses:
        '200':
          description: Shares.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/Share' }
    post:
      tags: [Shares]
      summary: Share an analysis (public link and card image)
      operationId: createShare
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [analysisId, format]
              properties:
                analysisId: { type: string }
                format: { type: string, enum: [story, square, link] }
                hideCompany: { type: boolean, default: false }
                showCalmTwin: { type: boolean, default: true }
      responses:
        '201':
          description: Share created. `url` is always https://jauge.io/a/{analysisId}.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Share' }
        '404': { $ref: '#/components/responses/Error' }
  /v1/shares/{id}:
    delete:
      tags: [Shares]
      summary: Delete a share (the public link stops working)
      operationId: deleteShare
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        '204': { description: Deleted. }
        '404': { $ref: '#/components/responses/Error' }
  /v1/account:
    get:
      tags: [Account]
      summary: The current account
      operationId: getAccount
      responses:
        '200':
          description: Account.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Account' }
        '401': { $ref: '#/components/responses/Error' }
    delete:
      tags: [Account]
      summary: Delete the account and all its data
      operationId: deleteAccount
      requestBody:
        required: false
        description: >-
          Optional. For accounts signed in with Apple, a fresh authorization code (Sign in with Apple done again on the
          deletion screen) lets the server revoke the Apple tokens. Without it the deletion goes on.
        content:
          application/json:
            schema:
              type: object
              properties:
                appleAuthorizationCode: { type: string, pattern: '^[A-Za-z0-9._-]{10,512}$' }
      responses:
        '202': { description: Deletion scheduled; the account is no longer usable. }
        '401': { $ref: '#/components/responses/Error' }
  /v1/account/consents:
    patch:
      tags: [Account]
      summary: Update the consents
      operationId: updateConsents
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Consents' }
      responses:
        '200':
          description: Updated account.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Account' }
  /health:
    get:
      tags: [Operations]
      summary: Health check (database reachable). Details (queue, spending) with the internal secret only.
      operationId: getHealth
      security: []
      responses:
        '200':
          description: Up (`ok` or `degraded`).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Health' }
        '503':
          description: Down.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Health' }
  /public/analyses/{id}:
    parameters:
      - $ref: '#/components/parameters/AnalysisId'
    get:
      tags: [Shares]
      summary: Public view of a shared analysis (page jauge.io/a/{id}); 404 once every share of it is deleted
      operationId: getPublicAnalysis
      security: []
      responses:
        '200':
          description: Shared analysis.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PublicAnalysis' }
        '404': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }
  /webhooks/revenuecat:
    post:
      tags: [Operations]
      summary: RevenueCat webhook (Authorization header configured in RevenueCat); updates the Jauge Plus mirror
      operationId: receiveRevenueCatEvent
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [event], properties: { event: { type: object } } }
      responses:
        '200':
          description: Event applied, ignored or already applied.
          content:
            application/json:
              schema: { type: object, properties: { status: { type: string, enum: [applied, duplicate, ignored] } } }
        '401': { $ref: '#/components/responses/Error' }
  /v1/subscription:
    get:
      tags: [Account]
      summary: Jauge Plus entitlement known by the server and free quota of the week
      operationId: getSubscription
      responses:
        '200':
          description: Subscription.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Subscription' }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: Supabase access token of the user (anonymous sessions included).
  parameters:
    AnalysisId:
      name: id
      in: path
      required: true
      schema: { type: string }
    SearchQuery:
      name: query
      in: query
      description: >-
        Optional search on the job title, the company and the city (or place) of each element. Case, accents,
        ligatures and the middle dots of inclusive writing are ignored ("chargee" finds "Chargé·e"); every word must
        appear in one of the fields, in any order. Absent or blank returns every element. It combines with `sort`
        and the other filters.
      schema: { type: string, maxLength: 100 }
    AreaCity:
      name: city
      in: query
      description: City of the search area of the user (Paris by default). Never a position.
      schema: { type: string }
    AreaDepartment:
      name: department
      in: query
      description: French department of the city (`75`, `2A`, `974`), absent when unknown.
      schema: { type: string }
  responses:
    Error:
      description: Error. `error.code` is machine readable, `error.message` is for developers only.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code]
          properties:
            code:
              type: string
              enum: [quota_reached, unreadable_offer, invalid_link, unsupported_link, image_too_large, validation_failed, unauthorized, not_found, rate_limited, maintenance, internal]
            message: { type: string }
    CreateAnalysisRequest:
      type: object
      required: [type]
      additionalProperties: false
      properties:
        type:
          type: string
          enum: [link, manual, text]
          description: >-
            `text`: text of a screenshot or a photo read on the phone (ML Kit on Android, Vision on iOS). The cheapest
            and most private way: the image never leaves the phone.
        url: { type: string, format: uri, maxLength: 2048, description: Required for `link`. }
        jobTitle: { type: string, maxLength: 200, description: Required for `manual`. }
        city: { type: string, maxLength: 120, description: Required for `manual`. }
        text: { type: string, minLength: 40, maxLength: 20000, description: Required for `text`. }
        origin: { type: string, enum: [screenshot, photo], description: Optional for `text`. }
        area: { $ref: '#/components/schemas/Area' }
    Area:
      type: object
      description: Search area of the user. Only a city and its department, never a position (found on the phone).
      required: [city, radiusKilometers]
      properties:
        city: { type: string, example: Lyon }
        departmentCode: { type: [string, 'null'], example: '69' }
        radiusKilometers: { type: integer, example: 30 }
    SalaryRange:
      type: object
      required: [minimum, maximum]
      properties:
        minimum: { type: integer, description: 'Thousands of euros, annual gross.' }
        maximum: { type: integer }
    Applicants:
      type: object
      required: [estimate, low, high]
      properties:
        estimate: { type: integer }
        low: { type: integer }
        high: { type: integer }
    Offer:
      type: object
      required: [jobTitle, city]
      properties:
        jobTitle: { type: string }
        company: { type: [string, 'null'] }
        city: { type: string }
        contractType: { type: string, enum: [permanent, fixed_term, apprenticeship, internship, freelance, temporary, other] }
        workMode: { type: [string, 'null'] }
        publishedOn: { type: [string, 'null'], format: date }
        displayedSalary: { oneOf: [ { $ref: '#/components/schemas/SalaryRange' }, { type: 'null' } ] }
        skills: { type: array, items: { type: string } }
        sourceUrl: { type: [string, 'null'], format: uri }
    ReadingStep:
      type: object
      required: [kind, status]
      properties:
        kind: { type: string, enum: [position_and_place, skills, comparison, applicants] }
        status: { type: string, enum: [pending, running, done] }
        detail: { type: [string, 'null'] }
    AnalysisResult:
      type: object
      required: [score, percentileInRegion, regionName, applicants, reliability]
      properties:
        score: { type: integer, minimum: 0, maximum: 100, description: '0 to 33 calm, 34 to 66 disputed, 67 to 100 crowded.' }
        percentileInRegion: { type: integer, minimum: 0, maximum: 100 }
        regionName: { type: string }
        applicants: { $ref: '#/components/schemas/Applicants' }
        reliability: { type: string, enum: [high, medium, low] }
        estimatedSalary: { oneOf: [ { $ref: '#/components/schemas/SalaryRange' }, { type: 'null' } ] }
        twinOfferCount: { type: integer }
        twinRadiusKilometers: { type: integer }
        trendThreeMonthsPercent: { type: integer }
        comparableOfferCount: { type: integer }
        timingAdvice:
          type: [object, 'null']
          properties:
            applyBefore: { type: string, enum: [MONDAY, TUESDAY, WEDNESDAY, THURSDAY, FRIDAY, SATURDAY, SUNDAY] }
            sharePercent: { type: integer }
            withinDays: { type: integer }
        reputation:
          oneOf: [ { $ref: '#/components/schemas/Reputation' }, { type: 'null' } ]
          description: What public posts (Reddit, X) say about the company and the job, summarized by the AI. Null when nothing was found.
        advice:
          oneOf: [ { $ref: '#/components/schemas/Advice' }, { type: 'null' } ]
          description: Advice of the verdict written by the AI from the computed facts, in the language of the analysis. Null when unavailable (show timingAdvice).
    Analysis:
      type: object
      required: [id, status, createdAt]
      properties:
        id: { type: string }
        status: { type: string, enum: [processing, completed, failed] }
        createdAt: { type: string, format: date-time }
        progressPercent: { type: integer, minimum: 0, maximum: 100 }
        steps: { type: array, items: { $ref: '#/components/schemas/ReadingStep' } }
        publishedDaysAgo: { type: [integer, 'null'] }
        hasDisplayedSalary: { type: [boolean, 'null'] }
        offer: { oneOf: [ { $ref: '#/components/schemas/Offer' }, { type: 'null' } ] }
        result: { oneOf: [ { $ref: '#/components/schemas/AnalysisResult' }, { type: 'null' } ] }
        isFavorite: { type: boolean, default: false, description: True when the user starred the analysis. }
        failure:
          type: [object, 'null']
          properties:
            code: { type: string, enum: [unreadable_offer, unsupported_link, internal] }
            recognizedCompany: { type: [string, 'null'] }
    AnalysisSummary:
      type: object
      required: [id, createdAt, jobTitle, place, score]
      properties:
        id: { type: string }
        createdAt: { type: string, format: date-time }
        jobTitle: { type: string }
        company: { type: [string, 'null'] }
        place: { type: string }
        score: { type: integer }
        isFavorite: { type: boolean, default: false, description: True when the user starred the analysis. }
    AnalysisPage:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/AnalysisSummary' } }
        nextCursor: { type: [string, 'null'] }
    SalaryInsight:
      type: object
      required: [areaName, offerCount, scaleMinimum, scaleMaximum, middleHalf, median]
      properties:
        areaName: { type: string }
        offerCount: { type: integer }
        scaleMinimum: { type: integer }
        scaleMaximum: { type: integer }
        middleHalf: { $ref: '#/components/schemas/SalaryRange' }
        median: { type: integer }
        offerRange: { oneOf: [ { $ref: '#/components/schemas/SalaryRange' }, { type: 'null' } ] }
        negotiationTarget: { type: [integer, 'null'] }
    SkillsInsight:
      type: object
      required: [skills]
      properties:
        skills:
          type: array
          items:
            type: object
            required: [name, sharePercent]
            properties:
              name: { type: string }
              sharePercent: { type: integer }
              owned: { type: [boolean, 'null'] }
    TrendInsight:
      type: object
      required: [points, changeThreeMonthsPercent]
      properties:
        points:
          type: array
          items:
            type: object
            required: [month, applicantsPerOffer]
            properties:
              month: { type: string, pattern: '^[0-9]{4}-[0-9]{2}$' }
              applicantsPerOffer: { type: integer }
        changeThreeMonthsPercent: { type: integer }
    TwinOffers:
      type: object
      required: [areaName, radiusKilometers, items]
      properties:
        areaName: { type: string }
        radiusKilometers: { type: integer }
        items:
          type: array
          items:
            type: object
            required: [id, jobTitle, company, place, estimatedApplicants, score, distanceKilometers]
            properties:
              id: { type: string }
              jobTitle: { type: string }
              company: { type: string }
              place: { type: string }
              salary: { oneOf: [ { $ref: '#/components/schemas/SalaryRange' }, { type: 'null' } ] }
              estimatedApplicants: { type: integer }
              score: { type: integer }
              distanceKilometers: { type: integer }
              publishedOn: { type: [string, 'null'], format: date }
              url: { type: [string, 'null'], format: uri }
    Methodology:
      type: object
      required: [applicants, reliability, comparableOfferCount, regionName, salarySourceCount]
      properties:
        applicants: { $ref: '#/components/schemas/Applicants' }
        reliability: { type: string, enum: [high, medium, low] }
        reliabilityReasons: { type: array, items: { type: string }, description: In the language of Accept-Language. }
        comparableOfferCount: { type: integer }
        regionName: { type: string }
        salarySourceCount: { type: integer }
    Reputation:
      type: object
      required: [summary, tone, mentionCount, sources]
      properties:
        summary: { type: string, description: 'Two sentences at most, in the language of the analysis.' }
        tone: { type: string, enum: [positive, mixed, negative, unknown] }
        mentionCount: { type: integer }
        sources: { type: array, items: { type: string, enum: [reddit, x] } }
        links:
          type: array
          description: Public posts the summary relies on (5 at most), links without usernames.
          items:
            type: object
            required: [source, url]
            properties:
              source: { type: string, enum: [reddit, x] }
              url: { type: string, format: uri }
    Advice:
      type: object
      required: [text, missingSkills]
      properties:
        text: { type: string, description: 'Two or three sentences: when and how to apply. Every number comes from the result.' }
        negotiationArgument: { type: [string, 'null'], description: One sentence for the salary negotiation. }
        missingSkills: { type: array, items: { type: string }, description: Skills often asked by comparable offers and missing from this offer (4 at most). }
    PublicAnalysis:
      type: object
      description: What the page https://jauge.io/a/{analysisId} shows. No data about the user.
      required: [analysisId, jobTitle, place, score, applicants, reliability, regionName, createdAt]
      properties:
        analysisId: { type: string }
        jobTitle: { type: string }
        company: { type: [string, 'null'], description: Null when the share hides it. }
        place: { type: string }
        score: { type: integer }
        applicants: { $ref: '#/components/schemas/Applicants' }
        reliability: { type: string, enum: [high, medium, low] }
        regionName: { type: string }
        calmTwin:
          type: [object, 'null']
          properties:
            jobTitle: { type: string }
            place: { type: string }
            estimatedApplicants: { type: integer }
            score: { type: integer }
        createdAt: { type: string, format: date-time }
    Health:
      type: object
      required: [status, version, providers, database, maintenance]
      properties:
        status: { type: string, enum: [ok, degraded, down] }
        version: { type: string }
        providers: { type: string, enum: [simulated, live] }
        database: { type: string, enum: [ok, unreachable] }
        maintenance: { type: boolean }
        queue:
          type: object
          description: Only with the internal secret.
          properties:
            due: { type: integer }
            oldestDueSeconds: { type: [integer, 'null'] }
        spend:
          type: object
          description: Only with the internal secret.
          properties:
            todayUsd: { type: number }
            limitUsd: { type: number }
    Alert:
      type: object
      required: [id, analysisId, threshold]
      properties:
        id: { type: string }
        analysisId: { type: string }
        threshold: { type: integer }
        active: { type: boolean }
    Share:
      type: object
      required: [id, analysisId, url, format, createdAt]
      properties:
        id: { type: string }
        analysisId: { type: string }
        url: { type: string, format: uri, example: 'https://jauge.io/a/demo-marketing-digital' }
        imageUrl: { type: [string, 'null'], format: uri }
        format: { type: string, enum: [story, square, link] }
        hideCompany: { type: boolean }
        showCalmTwin: { type: boolean }
        createdAt: { type: string, format: date-time }
    Consents:
      type: object
      required: [marketingEmails]
      properties:
        marketingEmails: { type: boolean }
    Account:
      type: object
      required: [id]
      properties:
        id: { type: string }
        displayName: { type: [string, 'null'] }
        email: { type: [string, 'null'], format: email }
        signInMethod: { type: string, enum: [apple, google, email, none] }
        analysisCount: { type: integer }
        consents: { $ref: '#/components/schemas/Consents' }
    Subscription:
      type: object
      required: [status]
      properties:
        status: { type: string, enum: [free, trial, active, expired] }
        trialEndsOn: { type: [string, 'null'], format: date }
        renewsOn: { type: [string, 'null'], format: date }
        freeAnalysesLeftThisWeek: { type: integer }
