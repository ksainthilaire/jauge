# Supabase project of Jauge (local development with the Supabase CLI and settings to copy to the hosted project).
# No secret here: every secret is read from the environment (env(...)) or set with `supabase secrets set`.
# See docs/supabase.md.

project_id = "jauge"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
major_version = 17

[db.migrations]
enabled = true
schema_paths = []

[realtime]
enabled = true

[studio]
enabled = true
port = 54323

[auth]
enabled = true
# The app comes back through this deep link after Apple, Google or the email link (PKCE flow).
site_url = "io.jauge.app://login-callback"
additional_redirect_urls = ["io.jauge.app://login-callback", "https://jauge.io/auth/callback"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true
enable_anonymous_sign_ins = false

[auth.rate_limit]
email_sent = 4

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = false
# Magic links stay valid one hour and work once (the app says so when a link has expired).
otp_expiry = 3600

# Branded emails (French and English in one template: the app sends `data: { locale }` with the sign in request, and
# the templates read it as `.Data.locale`; French when it is missing). The subject is a Go template too.
# Copy the same subject and file content to the hosted project: dashboard > Authentication > Emails > Templates
# (see docs/supabase.md, section "E-mails de connexion avec Brevo").
[auth.email.template.magic_link]
subject = "{{ if and .Data (eq .Data.locale \"en\") }}Your Jauge sign-in link{{ else }}Ton lien de connexion à Jauge{{ end }}"
content_path = "./supabase/templates/magic_link.html"

# Only sent for a new account when "Confirm email" is on (enable_confirmations); same look as the magic link.
[auth.email.template.confirmation]
subject = "{{ if and .Data (eq .Data.locale \"en\") }}Confirm your email for Jauge{{ else }}Confirme ton adresse pour Jauge{{ end }}"
content_path = "./supabase/templates/confirmation.html"

# Emails go out through Brevo (SMTP relay). The login and the SMTP key are read from the environment, never written
# here: BREVO_SMTP_LOGIN (the SMTP login shown by Brevo, like 1a2b3c001@smtp-brevo.com) and BREVO_SMTP_KEY (an SMTP
# key, not the API key). Without them, set `enabled = false` to keep the local test inbox (Inbucket/Mailpit).
[auth.email.smtp]
enabled = true
host = "smtp-relay.brevo.com"
port = 587
user = "env(BREVO_SMTP_LOGIN)"
pass = "env(BREVO_SMTP_KEY)"
admin_email = "connexion@jauge.io"
sender_name = "Jauge"

[auth.external.apple]
enabled = true
client_id = "env(SUPABASE_AUTH_EXTERNAL_APPLE_CLIENT_ID)"
secret = "env(SUPABASE_AUTH_EXTERNAL_APPLE_SECRET)"
redirect_uri = ""

[auth.external.google]
enabled = true
client_id = "env(SUPABASE_AUTH_EXTERNAL_GOOGLE_CLIENT_ID)"
secret = "env(SUPABASE_AUTH_EXTERNAL_GOOGLE_SECRET)"
redirect_uri = ""
skip_nonce_check = false

[functions.send-notification]
enabled = true
# Called by the database (pg_net) with a shared secret header, not by users: no user JWT to verify.
verify_jwt = false

[functions.api]
enabled = true
# The function checks the Supabase access token itself (JWKS), and also serves the health check, the RevenueCat
# webhook and the internal routes woken by the database, which carry no user token.
verify_jwt = false
import_map = "./functions/api/deno.json"
